<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل المتابعة – مدارس دينا العالمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--n:#0a2a5e;--b:#0056a0;--c:#3cb4e0;--l:#e8f4fb;--l2:#d3e8f6;--fs:11px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#e6edf3;font-family:Tajawal,Tahoma,Arial,sans-serif;color:#102039}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--n);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar button,.bar label.bt{font:inherit;font-size:13px;background:var(--c);color:#04223f;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:700}
.bar button.o{background:#fff}.bar button.p{background:#ffd34d}
.bar span{color:#fff;font-size:12px}.bar input[type=number]{width:52px}
.imp{display:none;background:#fff;padding:10px;border-bottom:3px solid var(--c)}.imp.on{display:block}
.imp textarea{width:100%;height:90px;font:inherit}.imp button,.imp label{font:inherit;margin:4px 0 0 6px;padding:5px 10px;border-radius:6px;border:1px solid var(--b);background:var(--l);cursor:pointer}
.stage{overflow-x:auto;padding:14px}
.page{width:var(--sw,1123px);margin:0 auto;background:#fff;padding:14px 18px;box-shadow:0 2px 14px #0003}
.hd{display:grid;grid-template-columns:180px 1fr 180px;align-items:center;border-bottom:3px solid var(--n);padding-bottom:6px}
.hd img{height:78px;max-width:170px;object-fit:contain}.hd .ri{justify-self:start}.hd .le{justify-self:end}
.ct{text-align:center;line-height:1.55;font-weight:700;color:var(--n);font-size:13px}.ct>div:last-of-type{color:var(--b);font-size:15px;font-weight:800}
.ttl{background:linear-gradient(90deg,var(--n),var(--b));color:#fff;text-align:center;font-size:20px;font-weight:800;padding:5px;border-bottom:4px solid var(--c);margin-top:6px}
#meta{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--n);border-top:0;border-left:0}
.mc{display:flex;align-items:center;border-left:1px solid var(--n);border-top:1px solid var(--n);position:relative;min-height:28px}
.mc b{background:var(--l2);color:var(--n);padding:4px 8px;font-size:12.5px;min-width:78px;align-self:stretch;display:flex;align-items:center}
.mc input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;padding:2px 6px;font-weight:500}
.mc i{position:absolute;left:2px;top:2px;font-style:normal;color:#c33;cursor:pointer;font-size:12px}
table{width:100%;border-collapse:separate;border-spacing:0;border-top:1px solid #4f6d92;border-left:1px solid #4f6d92;margin-top:8px;font-size:var(--fs)}
th,td{border:0;border-right:1px solid #4f6d92;border-bottom:1px solid #4f6d92;padding:0;text-align:center;position:relative;line-height:1.35}
th{color:#fff;font-weight:700;padding:3px 4px}
.ix{width:30px;background:var(--l);font-weight:700;color:var(--n);padding:2px}
th.ix{background:var(--n);color:#fff}
th.nm{background:var(--n);min-width:130px}td.nm{text-align:right}
.gh.c0{background:var(--n)}.gh.c1{background:var(--b)}.gh.c2{background:#1b7fb3}
.sh{background:var(--l2);color:var(--n);min-width:34px}.mx{background:var(--l);padding:0}.tt{background:#cfe5f4;font-weight:800;color:var(--n)}
th.tt{background:var(--c);color:#04223f}
.ge{border-left:2.5px solid var(--n)}
tbody tr:nth-child(even) td{background:#f5fafd}tbody tr:nth-child(even) td.tt{background:#cfe5f4}
td input,th input{width:100%;min-width:0;border:0;background:transparent;font:inherit;text-align:center;padding:3px 2px;color:inherit}
td.nm input{text-align:right;padding-inline:5px}.mx input{font-weight:700;color:var(--b)}
td input:focus,.mc input:focus{outline:2px solid var(--c);background:#fffbe0}
[contenteditable]{outline:0;display:inline-block;min-width:16px}[contenteditable]:focus{background:#fff3;box-shadow:0 0 0 1px #fff}
.np{font-style:normal}
th .np a,a.np{font-size:10px;color:#ffe08a;cursor:pointer;margin:0 3px;text-decoration:underline}
.sh a.np{color:#c33;text-decoration:none;font-size:12px}
td.ix i.np{position:absolute;right:1px;top:0;color:#c33;cursor:pointer;display:none;font-size:11px}td.ix:hover i.np{display:block}
.bar select{font:inherit;font-size:13px;border-radius:6px;padding:5px;border:0}input.bad{background:#ffd6d6;color:#b00020;font-weight:700}.low{color:#c00020!important}#sm{margin-top:8px;background:var(--l);border:1px solid var(--c);padding:6px 10px;border-radius:6px;font-size:13px;color:var(--n);line-height:1.7}tfoot{display:table-row-group}tfoot td{background:var(--l2)!important;font-weight:700;color:var(--n);padding:2px}tfoot td.lb{background:var(--n)!important;color:#fff}.ct a.np,.lw a.np,.sg a.np{color:var(--b);cursor:pointer;margin:0 4px;font-size:10px;text-decoration:underline}.lw{text-align:center}.sg div span{outline:0}.sg{display:flex;justify-content:space-around;margin-top:16px;color:var(--n);font-weight:700;font-size:13px}
.sg div{text-align:center;min-width:200px}.sg div::after{content:"";display:block;border-bottom:1px dotted var(--n);margin-top:22px}
@media print{
@page{margin:0}
html,body{background:#fff;padding:0}.bar,.imp,.np{display:none!important}
.stage{padding:calc(var(--pm,5)*1mm);overflow:visible}.page{padding:0;box-shadow:none;zoom:var(--zl,1);width:var(--pwl,1123px)}@media print and (orientation:portrait){.page{zoom:var(--zp,1);width:var(--pwp,794px)}}.wr,.wh,.wf,.wb{display:block}body.fit .page{break-inside:avoid}tbody tr{height:var(--rl,auto)}@media print and (orientation:portrait){tbody tr{height:var(--rp,auto)}}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
thead{display:table-header-group}tr{break-inside:avoid}
.mc i{display:none}input.bad{background:none;color:inherit}}

<script>
const K='dina-reg-v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{v=String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.');const n=parseFloat(v);return isFinite(n)?n:0};
const mg=(n,s)=>({id:uid(),n,tot:true,subs:s.map(([n,m])=>({id:uid(),n,m}))});
const def=()=>({title:'سجل المتابعة',fs:11,grand:true,pct:true,stats:true,meta:[['الفصل الدراسي',''],['العام الدراسي',''],['القسم',''],['المرحلة',''],['الصف',''],['الفصل',''],['المادة','']],
groups:[mg('المشاركة والتفاعل',[['المشاركة',5],['التفاعل',5]]),mg('الواجبات',[['١',5],['٢',5],['٣',5]]),mg('الاختبارات القصيرة',[['١',10],['٢',10]])],
st:Array.from({length:30},()=>({n:'',c:{}})),sig:['المعلم/ـة','المدير الأكاديمي','مدير المدرسة']});
if(/[?&]reset/.test(location.search)){try{localStorage.removeItem(K)}catch(e){}}
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!D||!D.groups)D=def();
const G=id=>D.groups.find(g=>g.id==id),gmax=g=>g.subs.reduce((a,s)=>a+num(s.m),0);
let tm;const save=()=>{clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}},300)};
const rd=n=>Math.round(n*100)/100;
function sums(s){let tot=0,any=false;const a=D.groups.map(g=>{let t=0,h=false;g.subs.forEach(x=>{const v=s.c[x.id];if(v!==undefined&&String(v).trim()!==''){h=true;t+=num(v)}});tot+=t;any=any||h;return h?rd(t):''});return{a,t:any?rd(tot):''}}
function recalc0(){D.st.forEach((s,r)=>{const m=sums(s);D.groups.forEach((g,i)=>{const e=document.getElementById('t'+r+g.id);if(e)e.textContent=m.a[i]});const e=document.getElementById('gt'+r);if(e)e.textContent=m.t});
D.groups.forEach(g=>{const e=document.getElementById('tm'+g.id);if(e)e.textContent=rd(gmax(g))});const e=document.getElementById('gm');if(e)e.textContent=rd(D.groups.reduce((a,g)=>a+gmax(g),0))}
const DEF={},DL={ix:'م',nm:'اسم الطالب',tot:'المجموع',gt:'المجموع الكلي',pc:'النسبة %',gd:'التقدير',a:'المتوسط',x:'الأعلى',n:'الأدنى'};let LS='r';
const LB=k=>`<span contenteditable data-lb="${k}">${esc(D.lb[k])}</span>`;
function renderSet(){$('#st').innerHTML=`<b>إعدادات السجل</b><div style="margin:6px 0">عدد حقول البيانات في الصف: <input type="number" data-set="mcols" min="1" max="8" value="${D.mcols}" style="width:56px"> &nbsp; حد التعثر (أقل من ٪): <input type="number" data-set="pass" min="1" max="100" value="${D.pass}" style="width:56px"> &nbsp; هامش الطباعة (مم): <input type="number" data-set="pm" min="1" max="20" value="${D.pm}" style="width:56px"></div><button data-act="asg">＋ توقيع</button><button data-act="ce">حذف الصفوف الفارغة</button><button data-act="cm">مسح كل الدرجات</button>`}
const amx=()=>D.groups.reduce((a,g)=>a+gmax(g),0);
const pcOf=s=>{const m=sums(s),x=amx();return m.t===''||!x?'':rd(m.t/x*100)};
const gr=p=>([...D.gs].sort((a,b)=>b[0]-a[0]).find(x=>p>=x[0])||[0,''])[1];
function mat(){return D.st.map(s=>{const m=sums(s),r=[];D.groups.forEach((g,j)=>{g.subs.forEach(x=>{const v=s.c[x.id];r.push(v!==undefined&&/[\d٠-٩]/.test(v)?num(v):'')});if(g.tot)r.push(m.a[j])});if(D.grand)r.push(m.t);if(D.pct)r.push(pcOf(s));return r})}
function recalc(){recalc0();
const sm={};D.groups.forEach(g=>g.subs.forEach(s=>sm[s.id]=s));
document.querySelectorAll('td input[data-s]').forEach(i=>{const s=sm[i.dataset.s];i.classList.toggle('bad',!!s&&/[\d٠-٩]/.test(i.value)&&num(i.value)>num(s.m))});
D.st.forEach((s,r)=>{const p=pcOf(s),a=document.getElementById('pc'+r),b=document.getElementById('gd'+r);
if(a){a.textContent=p===''?'':p+'%';a.classList.toggle('low',p!==''&&p<D.pass)}
if(b){b.textContent=p===''?'':gr(p);b.classList.toggle('low',p!==''&&p<D.pass)}});
if(D.stats){const M=mat();(M[0]||[]).forEach((_,ci)=>{const v=M.map(r=>r[ci]).filter(x=>x!=='');['a','x','n'].forEach(k=>{const e=document.getElementById('f'+k+ci);if(e)e.textContent=v.length?rd(k=='a'?v.reduce((p,q)=>p+q,0)/v.length:k=='x'?Math.max(...v):Math.min(...v)):''})})}
const ps=D.st.map(s=>({n:s.n,p:pcOf(s)})).filter(x=>x.p!==''),el=document.getElementById('sm');
if(!ps.length){el.innerHTML='';return}
const top=[...ps].sort((a,b)=>b.p-a.p).slice(0,3).map(x=>esc(x.n||'—')+' ('+x.p+'%)').join('، '),low=ps.filter(x=>x.p<D.pass);
el.innerHTML=`<b>ملخص:</b> رُصدت درجات ${ps.length} من ${D.st.length} · المتوسط ${rd(ps.reduce((a,x)=>a+x.p,0)/ps.length)}% · الأوائل: ${top} · أقل من ${D.pass}٪ (${low.length}): ${low.slice(0,8).map(x=>esc(x.n||'—')).join('، ')||'لا أحد'}`}
